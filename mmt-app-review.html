<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เคสรีวิวสาขา (ข้อมูลตัวอย่าง)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --font:'Anuphan','Inter','Segoe UI',Tahoma,sans-serif;
  --mono:'Inter','Anuphan',ui-monospace,Consolas,monospace;
  --r-sm:8px; --r-md:14px;
  --page:#fcf8e6; --surface:#fffef9; --surface-2:#faf5e2; --surface-3:#f5eed6;
  --line:#e7ddba;
  --ink:#2b2718; --ink-dim:#5f5738; --ink-faint:#8d8259;
  --brand:#0e7a70; --pos:#0e7a70; --neg:#bf4a17; --warn:#d97706;
  --shadow:0 12px 34px rgba(120,100,40,.10); --shadow-lg:0 20px 54px rgba(120,100,40,.16);
  --chart-axis:#ddd0a5;
  --c1:#bf4a17; --c2:#d97706; --c3:#0e7a70; --c4:#12a094; --c5:#b45309; --c6:#2ec4b6;
  --nav-bg:linear-gradient(180deg,#06413b,#052e2a); --nav-ink:#e6f2ef; --nav-ink-faint:#9dbbb5;
  --bar:rgba(191,74,23,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --page:#052e2a; --surface:rgba(6,46,42,.82); --surface-2:rgba(2,21,19,.55); --surface-3:rgba(3,34,31,.96);
  --line:rgba(46,196,182,.28);
  --ink:#eafffb; --ink-dim:#9dc9c2; --ink-faint:#5f8b85;
  --brand:#2ec4b6; --pos:#2ec4b6; --neg:#f5a623; --warn:#ffc45f;
  --chart-axis:rgba(122,231,220,.4);
  --c1:#f5a623; --c2:#ffc45f; --c3:#2ec4b6; --c4:#12a094; --c5:#e08a3c; --c6:#7ae7dc;
  --bar:rgba(245,166,35,.22);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#052e2a; --surface:rgba(6,46,42,.82); --surface-2:rgba(2,21,19,.55); --surface-3:rgba(3,34,31,.96);
  --line:rgba(46,196,182,.28);
  --ink:#eafffb; --ink-dim:#9dc9c2; --ink-faint:#5f8b85;
  --brand:#2ec4b6; --pos:#2ec4b6; --neg:#f5a623; --warn:#ffc45f;
  --chart-axis:rgba(122,231,220,.4);
  --c1:#f5a623; --c2:#ffc45f; --c3:#2ec4b6; --c4:#12a094; --c5:#e08a3c; --c6:#7ae7dc;
  --bar:rgba(245,166,35,.22);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--page); color:var(--ink); font-family:var(--font);
  font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased}
.shell{display:flex; min-height:100vh}
.nav{width:224px; flex:none; background:var(--nav-bg); color:var(--nav-ink);
  padding:20px 14px; position:sticky; top:0; align-self:flex-start; height:100vh;
  overflow-y:auto; display:flex; flex-direction:column; gap:6px}
.nav__brand{font-weight:700; font-size:14.5px; line-height:1.35}
.nav__brand em{display:block; font-style:normal; font-size:10px; font-family:var(--mono);
  letter-spacing:.14em; text-transform:uppercase; color:var(--nav-ink-faint); margin-top:4px}
.nav__sep{height:1px; background:rgba(255,255,255,.13); margin:12px 0 8px}
.nav__i{appearance:none; border:0; background:none; color:var(--nav-ink-faint);
  font:inherit; font-size:13px; text-align:left; padding:10px 11px; border-radius:10px;
  cursor:pointer; display:flex; gap:9px; width:100%; line-height:1.35}
.nav__i b{font-family:var(--mono); font-size:10.5px; opacity:.65}
.nav__i:hover{background:rgba(255,255,255,.08); color:var(--nav-ink)}
.nav__i.on{background:rgba(255,255,255,.14); color:#fff; font-weight:600}
.nav__meta{margin-top:auto; padding-top:14px; font-family:var(--mono); font-size:9.5px;
  line-height:1.9; color:var(--nav-ink-faint)}
.main{flex:1 1 auto; min-width:0}
.wrap{max-width:1180px; margin:0 auto; padding:26px 22px 90px; position:relative}
@media (max-width:860px){ .shell{display:block}
  .nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px}
  .nav__brand,.nav__sep,.nav__meta{display:none} .nav__i{width:auto} }
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.01em; text-wrap:balance}
h1{font-size:clamp(21px,2.6vw,30px); line-height:1.22}
h2{font-size:clamp(17px,2vw,22px); line-height:1.3}
p{margin:0}
header{margin-bottom:20px}
.ttl{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--brand);
  font-family:var(--mono); font-weight:600; margin-bottom:6px}
.hmeta{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.chip{font-family:var(--mono); font-size:11px; padding:4px 11px; border-radius:99px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink-dim)}
#tg{position:absolute; right:22px; top:26px; background:var(--surface); color:var(--ink-dim);
  border:1px solid var(--line); border-radius:99px; padding:7px 15px; font:inherit;
  font-size:12.5px; cursor:pointer}
#rf{position:absolute; right:120px; top:26px; background:var(--brand); color:#fff;
  border:1px solid var(--brand); border-radius:99px; padding:7px 16px; font:inherit;
  font-size:12.5px; cursor:pointer; font-weight:600}
#rf:hover{filter:brightness(1.08)}
#rf[disabled]{opacity:.55; cursor:progress}
#rfmsg{position:absolute; right:22px; top:60px; font-size:11.5px; color:var(--ink-faint);
  font-family:var(--mono)}
.page{display:none} .page.on{display:block}
.step{position:relative; padding-left:44px; margin-bottom:24px}
.step::before{content:attr(data-n); position:absolute; left:0; top:2px;
  width:30px; height:30px; border-radius:50%; background:var(--brand); color:#fff;
  font-family:var(--mono); font-size:13px; font-weight:700; display:grid; place-items:center}
.step::after{content:""; position:absolute; left:14.5px; top:36px; bottom:-24px; width:1px;
  background:var(--line)}
.step:last-child::after{display:none}
.step h2{margin-bottom:5px}
.lede{font-size:14.5px; color:var(--ink-dim); max-width:88ch; margin-bottom:12px}
.lede b{color:var(--ink)}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:17px 18px 15px; box-shadow:var(--shadow); margin-bottom:14px}
.sec{font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--brand);
  font-family:var(--mono); font-weight:600}
.hint{font-size:12.5px; color:var(--ink-faint); margin-top:3px; max-width:92ch}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r-md);
  overflow:hidden; margin-bottom:14px}
.kpi{background:var(--surface); padding:13px 15px}
.kpi .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-faint); margin-bottom:4px}
.kpi .v{font-size:23px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.12}
.kpi .d{font-size:11.5px; color:var(--ink-dim); margin-top:2px}
.chart{width:100%; height:auto; display:block; overflow:visible}
.gl{stroke:var(--line); stroke-width:1}
.ax{stroke:var(--chart-axis); stroke-width:1}
.tk{fill:var(--ink-faint); font-size:10.5px; font-family:var(--mono)}
.vl{fill:var(--ink); font-size:10.5px; font-family:var(--mono); font-weight:600}
.wrap-t{overflow-x:auto; max-height:70vh; overflow-y:auto}
table{width:100%; border-collapse:collapse; font-size:12.5px}
th,td{padding:7px 9px; text-align:right; border-bottom:1px solid var(--line); vertical-align:top}
th{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:600; position:sticky; top:0; z-index:2;
  background:var(--surface); box-shadow:inset 0 -1px 0 var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{font-variant-numeric:tabular-nums; color:var(--ink-dim)}
td.nm{color:var(--ink); font-weight:500; white-space:nowrap}
tr.tot td{border-top:2px solid var(--line); color:var(--ink); font-weight:700}
.cell{position:relative; display:block; padding:2px 0}
.cell i{position:absolute; left:0; top:50%; transform:translateY(-50%);
  height:15px; border-radius:3px; background:var(--bar); z-index:0}
.cell span{position:relative; z-index:1}
.pill{display:inline-block; padding:1px 8px; border-radius:99px; font-size:10.5px;
  font-family:var(--mono); white-space:nowrap}
.pill.ok{background:rgba(14,122,112,.16); color:var(--pos)}
.pill.no{background:rgba(191,74,23,.13); color:var(--neg)}
.pill.w{background:rgba(217,119,6,.15); color:var(--warn)}
.tools{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin:12px 0 10px}
.tools input,.tools select{font:inherit; font-size:13px; padding:7px 12px; border-radius:99px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink)}
.tools input{min-width:240px}
.tools input:focus,.tools select:focus{outline:none; border-color:var(--brand)}
.cnt{font-size:12.5px; color:var(--ink-faint)}
.det{white-space:normal; max-width:640px; color:var(--ink-dim); line-height:1.6}
.det b{color:var(--ink)}
.fb{white-space:normal; max-width:420px; font-size:11.5px; color:var(--ink-dim);
  border-left:2px solid var(--pos); padding-left:8px; margin-top:5px; line-height:1.55}
a{color:var(--brand)}
.note{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-md);
  padding:15px 17px; font-size:13px; color:var(--ink-dim); line-height:1.72; margin-bottom:14px}
.note b{color:var(--ink)} .note ul{margin:6px 0 0; padding-left:19px} .note li{margin:4px 0}
.warnbox{border-left:3px solid var(--warn)}
#tip{position:fixed; z-index:99; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--surface); border:1px solid var(--chart-axis); border-radius:9px;
  padding:8px 11px; font-size:12.5px; box-shadow:var(--shadow); color:var(--ink); max-width:320px}
</style>
</head>
<body>
<div class="shell">
<aside class="nav">
  <div class="nav__brand">องค์กรตัวอย่าง<em>FP&amp;A · Voice of Customer</em></div>
  <div class="nav__sep"></div>
  <button class="nav__i on" data-p="p1"><b>01</b><span>รีวิว Google Maps</span></button>
  <button class="nav__i" data-p="p2"><b>02</b><span>แจ้งปัญหาออนไลน์</span></button>
  <button class="nav__i" data-p="p3"><b>03</b><span>ที่มาและคุณภาพข้อมูล</span></button>
  <div class="nav__meta" id="navmeta"></div>
</aside>
<main class="main">
<div class="wrap">
<button id="tg" type="button">สลับโทนสี</button>
<button id="rf" type="button" hidden>ดึงข้อมูลใหม่ตอนนี้</button>
<header>
  <div class="ttl">เสียงจากลูกค้า · ฝ่าย FP&amp;A</div>
  <h1 id="h1"></h1>
  <div class="hmeta" id="hmeta"></div>
  <div id="rfmsg"></div>
</header>
<div class="page on" id="p1"></div>
<div class="page" id="p2"></div>
<div class="page" id="p3"></div>
</div>
</main>
</div>
<div id="tip" role="status" aria-live="polite"></div>

};

function tally(arr, keyFn){
  const m={};
  arr.forEach(x=>{ const ks=keyFn(x); (Array.isArray(ks)?ks:[ks]).forEach(k=>{
    if(k==null||k==='') return; m[k]=(m[k]||0)+1; }); });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

}

MONTH = (function(){
  /* ต้องกรองวันที่เสียออกก่อน ไม่งั้นค่าอย่าง '19713-07-15' จะกลายเป็นเดือนเริ่มต้น
     แล้วลูปข้างล่างไม่ทำงานสักรอบ ได้ลิสต์ว่าง กราฟรายเดือนเลยหายไปทั้งอัน */
  const m={};
  C.forEach(c=>{ if(!okDate(c.d)) return; const k=c.d.slice(0,7); m[k]=(m[k]||0)+1; });
  const ks=Object.keys(m).sort();
  if(!ks.length) return [];
  const out=[]; let [y,mo]=ks[0].split('-').map(Number);
  const [ey,em]=ks[ks.length-1].split('-').map(Number);
  /* กันลูปวิ่งยาวเกินเหตุถ้าวันที่ยังหลุดกรอบมาได้อีก — 10 ปีพอเหลือเฟือ */
  let guard=0;
  while((y<ey || (y===ey && mo<=em)) && guard++<120){
    const k=y+'-'+String(mo).padStart(2,'0');
    out.push([k, m[k]||0]); mo++; if(mo>12){mo=1;y++;}
  }
  return out;
})();

function barH(id, rows, opt){
  const svg=$('#'+id); if(!svg||!rows.length) return;
  opt=opt||{};
  /* กราฟที่อยู่ในแผงครึ่งจอต้องตั้ง viewBox ให้แคบลง
     ไม่งั้นเบราว์เซอร์ย่อทั้งภาพลงครึ่งหนึ่ง ตัวหนังสือเหลือครึ่งขนาดจนอ่านไม่ออก
     ยึดหลัก 1 หน่วยใน viewBox ≈ 1 พิกเซลจริงบนจอ */
  const W=opt.W||1060,L=opt.L||300,R=opt.R||120,T=18,B=12,step=opt.step||27;
  const H=T+B+rows.length*step;
  clear(svg,W,H);
  const mx=Math.max(...rows.map(r=>r[1]))||1, bh=Math.min(19,step-7);
  rows.forEach((r,i)=>{
    const y=T+i*step, w=Math.max(2,r[1]/mx*(W-L-R));
    const col=CV(opt.color||PAL[i%PAL.length]);
    const b=el('rect',{x:L,y,width:w,height:bh,fill:col,rx:4,opacity:opt.flat?.85:1},svg);
    hit(b, r[2]||('<b>'+esc(r[0])+'</b><br>'+r[1]+' เคส'));
    txt(svg,L-10,y+bh*.78,r[0].length>44?r[0].slice(0,43)+'…':r[0],'tk','end')
      .setAttribute('style','fill:var(--ink);font-size:12px');
    txt(svg,L+w+9,y+bh*.78,r[1]+(opt.unit||' เคส')+(opt.pct?'  ('+P1(r[1]/opt.pct*100)+')':''),'vl');
  });
}
function lineM(id, rows){
  const svg=$('#'+id); if(!svg||!rows.length) return;
  const W=1060,H=280,L=54,R=28,T=26,B=46;
  clear(svg,W,H);
  const mx=Math.max(4,...rows.map(r=>r[1]));
  /* เว้นขอบซ้ายขวาไว้ครึ่งแท่ง ไม่งั้นแท่งแรกจะล้ำไปทับตัวเลขแกน Y
     และแท่งสุดท้ายจะล้นออกนอกกรอบทางขวา */
  const bw=Math.min(72,(W-L-R)/rows.length*.55), pad=bw/2+8;
  const X=i=>L+pad+(W-L-R-pad*2)*(rows.length<2?0:i/(rows.length-1)),
        Y=v=>H-B-(H-B-T)*(v/mx);
  for(let g=0;g<=4;g++){ const v=mx*g/4;
    el('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),class:'gl'},svg);
    txt(svg,L-8,Y(v)+4,Math.round(v),'tk','end'); }
  rows.forEach((r,i)=>{
    const h=Math.max(0,H-B-Y(r[1]));
    const b=el('rect',{x:X(i)-bw/2,y:Y(r[1]),width:bw,height:h,fill:CV('--c1'),rx:3,opacity:.85},svg);
    hit(b,'<b>'+esc(thYM(r[0]))+'</b><br>'+r[1]+' เคส');
    if(r[1]) txt(svg,X(i),Y(r[1])-6,r[1],'vl','middle');
    txt(svg,X(i),H-B+16,MTH[+r[0].slice(5,7)-1],'tk','middle');
    if(i===0||r[0].slice(5,7)==='01') txt(svg,X(i),H-B+30,r[0].slice(0,4),'tk','middle');
  });
  el('line',{x1:L,x2:W-R,y1:H-B,y2:H-B,class:'ax'},svg);
}

function caseRows(){
  const q=($('#q').value||'').trim().toLowerCase();
  const z=$('#fz').value, t=$('#ft').value, s=$('#fs').value;
  return C.filter(c=>{
    if(z && c.z!==z) return false;
    if(t && (c.ty||[]).indexOf(t)<0) return false;
    if(s==='1' && !c.fixed) return false;
    if(s==='0' && c.fixed) return false;
    if(q){ const hay=(c.br+' '+c.det+' '+(c.ty||[]).join(' ')+' '+c.z+' '+(c.fb||'')).toLowerCase();
      if(hay.indexOf(q)<0) return false; }
    return true;
  }).sort((a,b)=>(b.d||'').localeCompare(a.d||''));
}

/* ══════════ วาด ══════════ */
function draw(){
  if(!$('#p1').classList.contains('on')) return;
  barH('c_ty', TY.map(t=>[t[0],t[1]]), {pct:C.length, L:330});
  /* กราฟช่วงเวลา : แกนนอนคือเวลา แถบเริ่มที่ครั้งแรกและจบที่ครั้งล่าสุด */
  const svg=$('#c_span');
  /* รับเฉพาะช่วงที่วันที่อ่านได้จริง แถวที่วันที่พังไม่เอามาวาด
     ไม่งั้นแถวเดียวลากสเกลทั้งกราฟจนแถบอื่นหลุดกรอบไปหมด */
  const rows=Object.entries(TYSPAN).filter(r=>okDate(r[1].first)&&okDate(r[1].last))
    .sort((a,b)=>a[1].first.localeCompare(b[1].first));
  if(svg&&rows.length){
    const W=1060,L=330,R=70,T=30,B=30,step=27,H=T+B+rows.length*step;
    clear(svg,W,H);
    const t0=new Date(rows.reduce((m,r)=>r[1].first<m?r[1].first:m,rows[0][1].first));
    const t1=new Date(TODAY);
    /* หนีบไว้ในกรอบเสมอ ค่าที่หลุดจะไปกองที่ขอบ ไม่ใช่หายออกนอกจอ */
    const X=d=>{ const x=L+(W-L-R)*((new Date(d)-t0)/Math.max(1,(t1-t0)));
      return isFinite(x) ? Math.max(L, Math.min(W-R, x)) : L; };
    /* เส้นแบ่งเดือนไว้อ่านตำแหน่งเวลา */
    let cur=new Date(t0.getFullYear(),t0.getMonth(),1);
    while(cur<=t1){
      const x=X(cur.toISOString().slice(0,10));
      if(x>=L){ el('line',{x1:x,x2:x,y1:T-8,y2:H-B,class:'gl'},svg);
        txt(svg,x,T-12,MTH[cur.getMonth()],'tk','middle'); }
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    }
    rows.forEach((r,i)=>{
      const [k,s]=r, y=T+i*step;
      const x0=X(s.first), x1=X(s.last);
      el('rect',{x:x0,y,width:Math.max(3,x1-x0),height:15,rx:4,
        fill:CV(s.fixed===s.n?'--c3':'--c1'),opacity:.75},svg);
      const dot=el('circle',{cx:Math.max(x0+2,x1),cy:y+7.5,r:5,
        fill:CV(s.fixed===s.n?'--c3':'--c1')},svg);
      hit(dot,`<b>${esc(k)}</b><br>${s.n} เคส<br>ครั้งแรก ${thDate(s.first)}<br>
        ล่าสุด ${thDate(s.last)}<br>ช่วงที่พบ ${days(s.first,s.last)} วัน<br>
        เริ่มมาแล้ว ${days(s.first,TODAY)} วัน<br>ตอบกลับ ${s.fixed}/${s.n}`);
      txt(svg,L-10,y+12,k.length>44?k.slice(0,43)+'…':k,'tk','end')
        .setAttribute('style','fill:var(--ink);font-size:12px');
      txt(svg,W-R+8,y+12,days(s.first,TODAY)+' วัน','vl');
    });
    el('line',{x1:L,x2:W-R,y1:H-B,y2:H-B,class:'ax'},svg);
    txt(svg,L,H-B+16,thDate(rows.reduce((m,r)=>r[1].first<m?r[1].first:m,rows[0][1].first)),'tk');
    txt(svg,W-R,H-B+16,'ถึงวันนี้','tk','end');
  }
  lineM('c_mon', MONTH);
  /* สองอันนี้อยู่ในแผงครึ่งจอ จึงใช้ viewBox แคบกว่ากราฟเต็มจอ */
  barH('c_zn', ZN.map(z=>[z[0],z[1]]), {W:520,L:120,R:96,step:30,color:'--c2',flat:1,pct:C.length});
  barH('c_star', STAR.map(s=>[s[0],s[1]]), {W:520,L:70,R:100,step:30,color:'--c1',flat:1,pct:C.length});
}
head(); draw();
}   /* จบ renderAll */

renderAll();

  ||(!document.documentElement.hasAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme',dk?'light':'dark'); draw();};

/* ══════════ ปุ่มดึงข้อมูลใหม่ ══════════
   ปุ่มจะโผล่เฉพาะตอนเปิดผ่าน Apps Script (มี google.script.run และมี token ที่ฉีดมา)
   เปิดไฟล์ทดสอบในเครื่องจะไม่เห็นปุ่ม เพราะไม่มีเซิร์ฟเวอร์ให้เรียก */
(function(){
  var btn=$('#rf'), msg=$('#rfmsg');
  var canRun = (typeof google!=='undefined' && google.script && google.script.run
                && typeof RV_TOKEN!=='undefined' && RV_TOKEN);
  if(!canRun) return;
  btn.hidden=false;
  btn.onclick=function(){
    btn.disabled=true; btn.textContent='กำลังดึง…';
    msg.textContent='กำลังอ่านข้อมูลสดจาก Google Sheet…';
    google.script.run
      .withSuccessHandler(function(res){
        btn.disabled=false; btn.textContent='ดึงข้อมูลใหม่ตอนนี้';
        if(!res || !res.ok){ msg.textContent='ดึงไม่สำเร็จ : '+((res&&res.message)||'ไม่ทราบสาเหตุ');
          return; }
        try{
          var fresh=JSON.parse(res.json);
          /* ทับเฉพาะก้อนข้อมูล ไม่แตะตัวแปรอื่นในหน้า */
          D.cases=fresh.cases; D.online=fresh.online; D.warn=fresh.warn;
          D.syncedAt=fresh.syncedAt; D.source=fresh.source;
          renderAll();
          msg.textContent='อัปเดตแล้ว '+fresh.syncedAt+' · '+fresh.cases.length+' เคส';
        }catch(err){ msg.textContent='อ่านข้อมูลที่ได้กลับมาไม่ได้ : '+err.message; }
      })
      .withFailureHandler(function(err){
        btn.disabled=false; btn.textContent='ดึงข้อมูลใหม่ตอนนี้';
        msg.textContent='ดึงไม่สำเร็จ : '+(err&&err.message?err.message:err);
      })
      .reviewRefresh(RV_TOKEN);
  };
})();
</script>
