<!-- home.html — เนื้อหาถูกย้ายไปไว้ที่หน้าแรกแล้ว หน้านี้เก็บไว้เพื่อไม่ให้ลิงก์เดิมเสีย -->
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <!-- ตั้งธีมก่อนเบราว์เซอร์วาดหน้าแรก กันจอแฟลชตอนเปลี่ยนหน้า
         ค่าเริ่มต้นคือโหมดมืด จะเป็นสว่างก็ต่อเมื่อผู้ใช้เลือกเองไว้ -->
    <script>document.documentElement.classList.add("dark-mode");try{if(localStorage.getItem("theme")==="light")document.documentElement.classList.remove("dark-mode")}catch(e){}</script>
    <!-- ใส่ธีมก่อนเบราว์เซอร์วาดหน้าแรก กันหน้าจอแฟลชขาวตอนเปลี่ยนหน้า -->
    <script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark-mode")}catch(e){}</script>
    <title>Phubordin Phanyosri | Data Analyst Portfolio</title>
    <link rel="canonical" href="https://phubordin.github.io/">
    <meta http-equiv="refresh" content="0; url=./">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script>location.replace("./");</script>
</head>

<body>
    <p>กำลังพาไปหน้าแรก… <a href="./">คลิกที่นี่ถ้าไม่ถูกพาไปอัตโนมัติ</a></p>
</body>

</html>
