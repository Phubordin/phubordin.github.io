<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wellness Center — Lead ORG (ตัวอย่าง)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --teal-950:#08160F; --teal-900:#12332C; --teal-700:#1F4D42;
    --gold-500:#C6A15B; --gold-300:#DEC48A; --mint:#2FA478;
    --text:#F1ECDF; --text-2:rgba(241,236,223,.76); --text-3:rgba(241,236,223,.5);
    --glow:rgba(198,161,91,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#FCF8E6;font-family:'Noto Sans Thai','Segoe UI',Tahoma,sans-serif;color:#1C2420}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#FCF8E6;opacity:0;transition:opacity .5s ease}
  #frame.in{opacity:1}

  /* ---------------- หน้าจอระหว่างรอโหลด ---------------- */
  #load{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,3vh,26px);padding:24px;text-align:center;color:var(--text);
    background:radial-gradient(120% 90% at 50% 22%, #1B4A3F 0%, var(--teal-900) 45%, var(--teal-950) 100%);
    transition:opacity .6s ease, visibility .6s}
  #load.done{opacity:0;visibility:hidden;pointer-events:none}
  /* ผืนหลัง: จุดพลังงานลอยขึ้นช้าๆ (CSS ล้วน — ไม่ต้องรอไลบรารีใดๆ) */
  #load::before{content:"";position:absolute;inset:-10%;pointer-events:none;opacity:.5;
    background:
      radial-gradient(2px 2px at 20% 80%, rgba(222,196,138,.9), transparent 60%),
      radial-gradient(2px 2px at 75% 70%, rgba(47,164,120,.8), transparent 60%),
      radial-gradient(1.6px 1.6px at 40% 95%, rgba(222,196,138,.7), transparent 60%),
      radial-gradient(2.4px 2.4px at 88% 92%, rgba(222,196,138,.6), transparent 60%),
      radial-gradient(1.8px 1.8px at 12% 60%, rgba(47,164,120,.7), transparent 60%),
      radial-gradient(2px 2px at 62% 88%, rgba(222,196,138,.75), transparent 60%);
    animation:drift 14s linear infinite}
  @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-38%)}}

  /* ตราสัญลักษณ์ + วงโคจร */
  .mark{position:relative;width:clamp(88px,16vw,112px);height:clamp(88px,16vw,112px);display:flex;align-items:center;justify-content:center;flex:none}
  .mark .lm{width:clamp(52px,9vw,66px);height:auto;color:var(--gold-300);animation:beat 2.6s ease-in-out infinite}
  .mark i{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--gold-300);
    border-right-color:rgba(222,196,138,.28);animation:spin 1.9s cubic-bezier(.6,.05,.4,1) infinite}
  .mark i:nth-of-type(2){inset:13px;border-top-color:rgba(47,164,120,.95);border-right-color:transparent;animation-duration:3s;animation-direction:reverse}
  .mark i:nth-of-type(3){inset:26px;border-top-color:rgba(222,196,138,.4);border-right-color:transparent;animation-duration:4.2s}
  .mark::after{content:"";position:absolute;inset:-18px;border-radius:50%;
    background:radial-gradient(circle, var(--glow) 0%, transparent 68%);opacity:.45;animation:halo 2.6s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes beat{0%,100%{opacity:.78;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
  @keyframes halo{0%,100%{opacity:.3;transform:scale(.92)}50%{opacity:.65;transform:scale(1.1)}}

  h2{margin:0;font-family:'Noto Serif Thai',serif;font-weight:600;font-size:clamp(18px,3vw,24px);color:#fff;text-wrap:balance;max-width:22ch}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-300);margin-bottom:-6px}

  /* แถบความคืบหน้า */
  .bar{position:relative;width:min(300px,72vw);height:5px;border-radius:99px;background:rgba(222,196,138,.16);overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--mint),var(--gold-300));transition:width .45s cubic-bezier(.3,.9,.3,1)}
  .bar.idle i{width:38%;animation:sweep 1.3s ease-in-out infinite;transition:none}
  @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  .pct{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--gold-300);min-height:1em}

  /* ขั้นตอนการโหลด */
  .steps{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--text-3)}
  .steps div{display:flex;align-items:center;gap:7px;transition:color .3s}
  .steps b{width:7px;height:7px;border-radius:50%;background:rgba(241,236,223,.22);transition:background .3s, box-shadow .3s}
  .steps div.on{color:var(--text-2)} .steps div.on b{background:var(--gold-300);box-shadow:0 0 10px var(--glow);animation:beat 1.4s ease-in-out infinite}
  .steps div.ok{color:var(--text-3)} .steps div.ok b{background:var(--mint);box-shadow:none;animation:none}

  .msg{font-size:13px;color:var(--text-2);min-height:1.4em}
  .hintline{font-size:12px;color:var(--text-3);max-width:34ch}
  #err{display:none;max-width:44ch;line-height:1.65;color:#F6C9C4;font-size:13.5px;
    background:rgba(180,69,47,.14);border:1px solid rgba(246,201,196,.28);border-radius:12px;padding:14px 16px}
  #err a{color:var(--gold-300);font-weight:600}

  #back{position:fixed;left:14px;bottom:14px;z-index:20;font:600 13px/1 'Noto Sans Thai',sans-serif;color:#F8F4EA;background:var(--teal-900);
    padding:10px 15px;border-radius:99px;text-decoration:none;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);opacity:.85;transition:opacity .2s,transform .2s}
  #back:hover{opacity:1;transform:translateY(-2px)}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>
  <iframe id="frame" title="กลุ่มเป้าหมาย (ตัวอย่าง)"></iframe>

  <div id="load" role="status" aria-live="polite" data-key="demo">
    <div class="mark"><i></i><i></i><i></i><svg stroke-linecap="round" class="lm" viewBox="0 0 120 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" aria-hidden="true"><path d="M60 68 V30"/><path d="M60 46 C44 46 31 37 27 18 C45 18 58 28 60 46 Z"/><path d="M60 38 C76 38 89 29 93 10 C75 10 62 20 60 38 Z"/></svg></div>
    <div class="kicker">Lead ORG</div>
    <h2>กลุ่มเป้าหมาย (ตัวอย่าง)</h2>
    <div class="bar idle" id="bar"><i id="fill"></i></div>
    <div class="pct" id="pct"></div>
    <div class="steps" id="steps">
      <div data-s="0"><b></b>เชื่อมต่อ Drive</div>
      <div data-s="1"><b></b>ดึงข้อมูล</div>
      <div data-s="2"><b></b>เตรียมหน้า Dashboard</div>
    </div>
    <div class="msg" id="msg">กำลังเชื่อมต่อ…</div>
    <div class="hintline" id="hint">ไฟล์ dashboard มีขนาดใหญ่ ใช้เวลาประมาณ 5–15 วินาทีในครั้งแรก</div>
    <div id="err"></div>
  </div>

  <a id="back" href="wnc-app-welcome.html" target="_top">← Wellness Center</a>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const KEY = $('load').dataset.key;                                // ชื่อ Target group ส่งมาทาง data-key ของ #load

  /* ---- ควบคุมขั้นตอนบนหน้าจอ ---- */
  const stepEls = [...document.querySelectorAll('.steps div')];
  function step(n) { stepEls.forEach((el, i) => { el.classList.toggle('ok', i < n); el.classList.toggle('on', i === n); }); }
  function progress(p) {                                            // p = 0..1 (null = ยังไม่รู้ขนาด → แถบวิ่งไปมา)
    const bar = $('bar');
    if (p == null) { bar.classList.add('idle'); $('pct').textContent = ''; return; }
    bar.classList.remove('idle');
    $('fill').style.width = Math.round(p * 100) + '%';
    $('pct').textContent = Math.round(p * 100) + '%';
  }
  const msg = t => $('msg').textContent = t;
  function fail(e) {
    step(-1); $('bar').style.display = 'none'; $('pct').textContent = '';
    msg('เปิด dashboard ไม่สำเร็จ'); $('hint').style.display = 'none';
    const el = $('err'); el.style.display = 'block';
    el.innerHTML = (e && e.message ? e.message : String(e)) + '<br><a href="javascript:location.reload()">ลองใหม่อีกครั้ง</a>';
  }

  (async () => {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const grp = new URLSearchParams(location.search).get('group');
    const label = { a: 'กลุ่มเป้าหมาย A', b: 'กลุ่มเป้าหมาย B' }[grp] || 'กลุ่มเป้าหมาย (ตัวอย่าง)';
    document.querySelector('#load h2').textContent = label;
    step(0); progress(null); await wait(500);
    const total = 4; step(1);
    for (let i = 0; i < total; i++) {
      progress((i + 1) / total); msg('ดึงข้อมูล ' + (i + 1) + ' / ' + total); await wait(240);
    }
    step(2); progress(1); msg('เตรียมหน้า Dashboard…');
    const f = $('frame');
    const reveal = () => { f.classList.add('in'); $('load').classList.add('done'); };
    f.onload = () => setTimeout(reveal, 180);
    f.src = 'mmt-app-target-group.html';
    setTimeout(reveal, 5000);
  })();
})();
</script>
</body>
</html>
